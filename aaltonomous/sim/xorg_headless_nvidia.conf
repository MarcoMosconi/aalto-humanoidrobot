# Headless X server on the NVIDIA GPU (no monitor) for the Isaac Sim GUI: Xorg :1 -config <this> -noreset -nolisten tcp
# BusID: nvidia-smi --query-gpu=pci.bus_id (00000000:05:00.0 -> PCI:5:0:0).
Section "ServerLayout"
    Identifier "L"
    Screen 0 "S"
EndSection
Section "Files"
    ModulePath "/usr/lib/x86_64-linux-gnu/nvidia/xorg"
    ModulePath "/usr/lib/xorg/modules"
EndSection
Section "Device"
    Identifier "D"
    Driver "nvidia"
    BusID "PCI:5:0:0"
    Option "AllowEmptyInitialConfiguration" "True"
    Option "HardDPMS" "false"
EndSection
Section "Screen"
    Identifier "S"
    Device "D"
    DefaultDepth 24
    Option "AllowEmptyInitialConfiguration" "True"
    SubSection "Display"
        Depth 24
        Virtual 1920 1080
    EndSubSection
EndSection
